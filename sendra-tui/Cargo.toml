[package]
name = "sendra-tui"
description = "Terminal UI for Sendra."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sendra-tui"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = [
  "crossterm",
] }
sendra-core = { path = "../sendra-core" }
# Pretty-prints a JSON response body in the response panel, the same
# `Content-Type` sniff and `to_string_pretty` sendra-cli's own
# `body_for_display` (`sendra-cli/src/output/human.rs`) uses, reimplemented
# here rather than shared because sendra-tui depends on sendra-core, not on
# sendra-cli.
serde_json = { workspace = true }
# Validates a live-typed method-field string against `sendra_core::Method`'s
# own `Deserialize` impl (see `app::validate_method_text`) — the same crate
# sendra-core itself already uses to parse a collection file's `method:`
# field, not a new dependency to the workspace, just wired into this crate
# too so edit mode checks against the real type instead of a hand-maintained
# list of method names.
serde_yaml = { workspace = true }
# Drives the request execution pipeline (`sendra_core::send`, which reqwest
# needs a runtime under). Current-thread only ("rt"): each run spins up its
# own runtime on its own OS thread (see `run_request::spawn`) rather than
# sharing one across the app, so there is never more than one task on it at a
# time — the same reasoning that keeps sendra-cli on "rt" instead of
# "rt-multi-thread" for its own single-request-at-a-time sends.
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
# The TUI/CLI resolution-parity test builds a real project
# directory on disk — `.sendra/config.yaml`, environment files, a
# collection — the same fixture-on-a-temp-dir pattern `sendra-core`'s and
# `sendra-cli`'s own tests already use this crate for.
tempfile = { workspace = true }
