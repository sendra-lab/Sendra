name: Sendra JUnit Check

on:
  workflow_dispatch:

jobs:
  junit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Sendra
        run: cargo build --workspace --release

      - name: Run Sendra tests
        run: |
          ./target/release/sendra test examples/collection.yaml --junit report.xml
        continue-on-error: true

      - name: Publish JUnit report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Sendra Test Results
          path: report.xml
          reporter: java-junit
