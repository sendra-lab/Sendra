[package]
name = "sendra-cli"
description = "Terminal-native HTTP client. Sends requests defined in YAML files."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sendra"
path = "src/main.rs"

[dependencies]
sendra-core = { path = "../sendra-core" }
clap = { workspace = true }
owo-colors = { workspace = true }
# `--json` output is built from view structs defined in `output/json.rs`, so
# the derive macro is what turns them into the documented schema.
serde = { workspace = true }
# Two jobs: emitting `--json`, and re-indenting a JSON response body in the
# human output. "preserve_order" is for the second — pretty-printing must show
# the object the server sent, in the order it sent it, and the default
# `Map<String, Value>` is a `BTreeMap` that would silently sort the keys.
serde_json = { workspace = true, features = ["preserve_order"] }
# `sendra import curl` serializes the `Request` it builds straight to YAML
# — the same crate `sendra-core` already parses request files with.
serde_yaml = { workspace = true }
# A single request per invocation means no work to spread across threads, so
# the current-thread runtime ("rt") is enough; "rt-multi-thread" would only add
# a worker pool nothing here uses. "macros" is for #[tokio::main]. "time" is
# for the fixed delay between retry attempts (`Request::retry.delay_ms`) —
# sequential `tokio::time::sleep` calls, never a spawned timer, since retries
# and `--repeat` both have to stay strictly one-send-at-a-time; see the note
# on `RedirectLog` in sendra-core.
tokio = { workspace = true, features = ["rt", "macros", "time"] }
# Shell-word tokenization for `sendra import curl`: splits a curl command
# line into argv the way a POSIX shell would (quotes, backslash escapes),
# rather than hand-rolling that grammar. Maintained by the rust-lang org
# (also used by `cc`, `bindgen`, `autocfg`) and already resolved into this
# workspace's `Cargo.lock` as a transitive build-dependency of `cc` — this
# just names it as a real, direct dependency of `sendra-cli` rather than
# pulling in a second crate for the same job.
shlex = "2"

[dev-dependencies]
# Which environment `--env` resolves to is tested against real directory trees,
# the way core tests config resolution, so the tests need somewhere disposable
# to build them.
tempfile = { workspace = true }
# The `--json` integration tests read the binary's stdout back as JSON.
serde_json = { workspace = true }
# The `--junit` integration tests parse the report back with a real XML
# parser, not just by eye. See the note on the workspace dependency.
roxmltree = { workspace = true }
# `--insecure`'s end-to-end test spins up its own self-signed TLS server —
# see the note on both in the workspace `Cargo.toml`. Duplicated from
# `sendra-core`'s own dev-dependency of the same crates rather than shared:
# `sendra-core`'s server helper is `pub(crate)` test-only code in a different
# crate, unreachable from here, so the fixture is rebuilt at this level
# too — small, and it is what actually proves `--insecure` end to end
# through the real binary rather than through `sendra-core`'s API directly.
rcgen = { workspace = true }
rustls = { workspace = true }
