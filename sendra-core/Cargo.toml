[package]
name = "sendra-core"
description = "Core request/response model, YAML loading and HTTP execution for Sendra."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_yaml = { workspace = true }
# Response bodies are parsed as JSON to evaluate `assertions.json`, and the
# expected values in that block are held as `serde_json::Value` so they are
# already in the form they will be compared against.
serde_json = { workspace = true }
# JSON path evaluation for `assertions.json`. See the note on
# `assertions::Assertions::json` for why this crate and not another.
jsonpath-rust = { workspace = true }
# `assertions.body_matches`. See the note on `assertions::Assertions::body_matches`
# for why this crate and not another.
regex = { workspace = true }
# `form:` bodies are URL-encoded the same way a browser encodes an HTML form
# (`application/x-www-form-urlencoded`); this is the standard crate for it
# rather than a hand-written percent-encoder.
serde_urlencoded = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
# `auth.basic` base64-encodes `user:pass` into the `Authorization` header —
# see the note on `Request::resolve_auth`.
base64 = { workspace = true }
# Locating the global config directory per platform. `dirs`, not `directories`:
# see the note on `config::global_config_path`.
dirs = { workspace = true }
# The `pre_request`/`post_request` scripting engine. Rust-native, so scripts
# work with no runtime to install alongside sendra, and sandboxed by
# construction: see the module docs on `script` for what is reachable from a
# script and what is not.
rhai = { workspace = true }

[dev-dependencies]
# Only the test harness needs a runtime here; the binary picks its own.
tokio = { workspace = true, features = ["rt", "macros"] }
# Config resolution is tested against real directory trees, so the tests need
# somewhere disposable to build them.
tempfile = { workspace = true }
# Encodes the gzip fixture body in the compression test.
flate2 = { workspace = true }
# `--insecure`'s test TLS server: a throwaway self-signed certificate...
rcgen = { workspace = true }
# ...and the handshake it terminates. See the note on both in the workspace
# `Cargo.toml`.
rustls = { workspace = true }
