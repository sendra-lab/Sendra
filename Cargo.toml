[workspace]
resolver = "2"
members = ["sendra-core", "sendra-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tempfile = "3"
serde_yaml = "0.9"
jsonpath-rust = "1"
# `assertions.body_matches`. Already pulled in transitively by jsonpath-rust,
# so this adds no new dependency to the tree — see the note on
# `assertions::Assertions::body_matches`.
regex = "1"
serde_urlencoded = "0.7"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "http2",
  "gzip",
  "brotli",
  "deflate",
] }
thiserror = "2"
# `auth.basic` base64-encodes `user:pass` into the `Authorization` header.
base64 = "0.22"
tokio = { version = "1", default-features = false }
clap = { version = "4", features = ["derive"] }
owo-colors = { version = "4", features = ["supports-colors"] }
# "no_module" is a sandboxing decision, not a size one: it removes Rhai's
# module system, and with it `import` and the filesystem-backed module
# resolver that is otherwise the default. See the note on `script::engine`.
rhai = { version = "1.26", features = ["no_module"] }
# Test-only: used to build gzip-compressed fixture bodies for the compression
# test in sendra-core. Already pulled in transitively by reqwest's "gzip"
# feature, so this adds no new dependency to the tree.
flate2 = "1"
# Test-only: verifies `--junit`'s hand-rolled XML actually parses under a
# real parser, not just under the eyes of whoever wrote the escaping. Small,
# pure-Rust, no transitive dependencies of its own — chosen over pulling in
# an XML writer for production use, since the report itself needs nothing
# more than string formatting and five characters of escaping.
roxmltree = "0.21"
