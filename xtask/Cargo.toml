[package]
name = "xtask"
description = "Workspace-internal tooling: generates the editor JSON Schemas under schema/."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# The `schema` feature turns on `#[derive(JsonSchema)]` on the on-disk
# request/collection/config types — see the note on that feature in
# sendra-core's Cargo.toml for why it stays off by default.
sendra-core = { path = "../sendra-core", features = ["schema"] }
schemars = { workspace = true }
serde_json = { workspace = true }
